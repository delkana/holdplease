  }
  ctx.beginPath(); ctx.arc(VOLW.tx + VOLW.tw*vol, VOLW.ty+2, volDrag ? 5.5 : 4.5, 0, 7);
  ctx.fillStyle = muted ? '#5a4a30' : '#e8cf92'; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.65)'; ctx.lineWidth = 1; ctx.stroke();
}

function renderRail(){
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(190,165,110,0.30)'; ctx.font = 'bold 9px Georgia, serif';
  ctx.fillText('CALL-BACK RAIL', RAIL.x, RAIL.y - 5);
  const free = !allTrunksBusy();
  for(let i=0;i<RAIL.slots;i++){
    const x = RAIL.x + i*152, cb = callbacks[i];
    ctx.fillStyle = cb ? 'rgba(226,213,182,0.92)' : 'rgba(255,255,255,0.025)';
    rr(x, RAIL.y, 144, RAIL.h, 3); ctx.fill();
    ctx.strokeStyle = cb && free ? 'rgba(255,200,110,0.85)' : 'rgba(0,0,0,0.4)';
    ctx.lineWidth = cb && free ? 1.8 : 1; ctx.stroke();
    if(!cb) continue;
    const l = lines[cb.line];
    ctx.fillStyle = '#3a2c18'; ctx.font = 'bold 12px Georgia, serif';
    ctx.fillText(l.num + '  ' + (l.party ? 'party line' : shortName(l.name)).slice(0,14), x+8, RAIL.y+17);
    ctx.font = '11px Georgia, serif'; ctx.fillStyle = '#6a5a3c';
    ctx.fillText(cb.town + ' ' + cb.tollNum, x+8, RAIL.y+32);
    const frac = Math.max(0, 1 - (now()-cb.filedAt)/cb.life);
    ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.fillRect(x+8, RAIL.y+40, 128, 5);
    ctx.fillStyle = frac < 0.3 ? '#a8331e' : '#7a6a3c'; ctx.fillRect(x+8, RAIL.y+40, 128*frac, 5);
    ctx.font = 'bold 9px Georgia, serif';
    ctx.fillStyle = free ? '#8a5a12' : 'rgba(60,50,36,0.45)';
    ctx.fillText(free ? 'TRUNK FREE — RING THEM BACK' : 'waiting on a trunk', x+8, RAIL.y+58);
  }
}

function render(){
  ctx.fillStyle = '#0d0a07'; ctx.fillRect(0,0,W,H);
  if(mode === 'name'){ renderNamePrompt(); renderVolume(); renderRotate(); return; }
  if(mode === 'scores'){ renderScores(); if(help) renderHelp(); renderVolume(); renderRotate(); return; }
  if(mode === 'title'){ renderTitle(); if(help) renderHelp(); renderVolume(); renderRotate(); return; }

  const jg = ctx.createLinearGradient(0,JACK.y0,0,JACK.y0+JACK.h);
  jg.addColorStop(0,'#241c14'); jg.addColorStop(1,'#171109');
  ctx.fillStyle = jg; rr(JACK.x0,JACK.y0,JACK.w,JACK.h,6); ctx.fill();
  ctx.strokeStyle = '#3d3020'; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = 'rgba(80,64,40,0.6)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(60, 304); ctx.lineTo(1220, 304); ctx.stroke();

  const wanted = wantedSet();
  for(const l of lines){
    if(l.trunk) continue;
    const calling = l.state === 'calling';
    if(calling){
      if(l.urgent){
        /* their hand is on the hook */
        ctx.globalAlpha = Math.sin(l.lampT*19) > -0.2 ? 1 : 0.12;
        lamp(l.x, l.y-26, 5, true, false);
        ctx.globalAlpha = 1;
        const beat = 0.5 + 0.5*Math.sin(l.lampT*19);
        ctx.strokeStyle = 'rgba(255,110,80,' + (0.35 + 0.45*beat) + ')';
        ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.arc(l.x, l.y, 17 + beat*3, 0, 7); ctx.stroke();
      } else {
        ctx.globalAlpha = 0.65 + 0.35*(Math.sin(l.lampT*4.5)*0.5+0.5);
        lamp(l.x, l.y-26, 5, true, false);
        ctx.globalAlpha = 1;
      }
    } else lamp(l.x, l.y-26, 5, l.ringT > 0, true);
    if(wanted.has(l.id)) drawWantGlow(l.x, l.y, 11);
    const busySeen = D.busyVisible && !calling && lineBusy(l);
    drawJackHole(l.x, l.y, 11, busySeen ? '#9c4a34' : null);

    ctx.textAlign = 'center';
    /* a party wire is called out by the cool tint on its number */
    ctx.fillStyle = l.party ? '#8fb6c4' : '#c9a95f'; ctx.font = 'bold 14px Georgia, serif';
    ctx.fillText(l.num, l.x, l.y+29);
    if(l.party){
      const names = l.members.map(m => shortName(m.name)).join(' · ');
      let fs = 9;
      ctx.font = fs+'px Georgia, serif';
      while(ctx.measureText(names).width > 142 && fs > 6.5){ fs -= 0.5; ctx.font = fs+'px Georgia, serif'; }
      ctx.fillStyle = 'rgba(175,200,210,0.55)';
      ctx.fillText(names, l.x, l.y+41);
    } else {
      ctx.fillStyle = 'rgba(190,170,130,0.55)'; ctx.font = '11px Georgia, serif';
      ctx.fillText(l.name, l.x, l.y+42);
    }
  }

  /* the toll trunks — their busy lamps are honest, unlike the subscriber jacks */
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(190,165,110,0.30)'; ctx.font = 'bold 9px Georgia, serif';
  ctx.fillText('TOLL TRUNKS', 62, RAIL.y - 5);
  for(const t of trunks){
    lamp(t.x, t.y-26, 5, lineBusy(t), false);
    if(wanted.has(t.id)) drawWantGlow(t.x, t.y, 12);
    drawJackHole(t.x, t.y, 12);
    ctx.textAlign = 'center';
    ctx.fillStyle = lineBusy(t) ? 'rgba(200,120,90,0.8)' : '#8fc39a';
    ctx.font = 'bold 11px Georgia, serif';
    ctx.fillText(t.name, t.x, t.y+26);
  }
  renderRail();

  const sg = ctx.createLinearGradient(0,SHELF_Y,0,H);
  sg.addColorStop(0,'#2b2115'); sg.addColorStop(1,'#120d08');
  ctx.fillStyle = sg; ctx.fillRect(0, SHELF_Y, W, H-SHELF_Y);
  ctx.strokeStyle = '#4a3a24'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,SHELF_Y); ctx.lineTo(W,SHELF_Y); ctx.stroke();

  for(const p of pairs){
    if(p.broken){
      /* springs stopped off, keys dead, a card over the ticket */
      for(const e of ['front','back']){
        const s = springPos(p,e);
        ctx.beginPath(); ctx.arc(s.x,s.y,12,0,7);
        ctx.fillStyle = '#0a0705'; ctx.fill();
        ctx.strokeStyle = '#3a2f1e'; ctx.lineWidth = 2; ctx.stroke();
        ctx.strokeStyle = 'rgba(160,80,60,0.5)'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(s.x-7, s.y-7); ctx.lineTo(s.x+7, s.y+7);
        ctx.moveTo(s.x+7, s.y-7); ctx.lineTo(s.x-7, s.y+7);
        ctx.stroke();
        lamp(s.x, SUPY, 4.5, false, true);
      }
      const bk = keyRects(p);
      for(const r of [bk.listen, bk.ring]){
        rr(r.x, r.y, r.w, r.h, 3);
        ctx.fillStyle = 'rgba(12,9,6,0.9)'; ctx.fill();
        ctx.strokeStyle = 'rgba(70,56,38,0.6)'; ctx.lineWidth = 1; ctx.stroke();
      }
      ctx.fillStyle = 'rgba(46,34,24,0.75)';
      rr(p.x-70, TICKY, 140, TICKH, 3); ctx.fill();
      ctx.strokeStyle = 'rgba(160,80,60,0.45)'; ctx.lineWidth = 1.4; ctx.stroke();
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(200,110,85,0.85)'; ctx.font = 'bold 12px Georgia, serif';
      ctx.fillText('OUT OF', p.x, TICKY + 52);
      ctx.fillText('ORDER', p.x, TICKY + 68);
      ctx.fillStyle = 'rgba(150,110,90,0.5)'; ctx.font = 'italic 10px Georgia, serif';
      ctx.fillText('cords away for repair', p.x, TICKY + 88);
      ctx.fillStyle = 'rgba(160,90,70,0.5)'; ctx.font = 'bold 11px Georgia, serif';
      ctx.fillText('PAIR ' + (p.id+1), p.x, TICKY+TICKH+15);
      continue;
    }
    for(const e of ['front','back']){
      const s = springPos(p,e);
      ctx.beginPath(); ctx.arc(s.x,s.y,12,0,7);
      ctx.fillStyle = '#0d0906'; ctx.fill();
      ctx.strokeStyle = '#4d3f28'; ctx.lineWidth = 2; ctx.stroke();
      const l = endLine(p,e), snoop = l != null && lines[l].snoop;
      const flick = snoop && Math.sin(shiftT*9 + p.id) > 0.1;
      lamp(s.x, SUPY, 4.5, supLit(p,e) || flick, true);
    }
    const k = keyRects(p);
    drawKey(k.listen, p.listen, 'LSN');
    drawKey(k.ring, p.ring, 'RNG');

    const c = p.call;
    ctx.fillStyle = c ? 'rgba(226,213,182,0.94)' : 'rgba(60,50,36,0.5)';
    rr(p.x-70, TICKY, 140, TICKH, 3); ctx.fill();
    if(c && c.urgent){
      const beat = 0.5 + 0.5*Math.sin(shiftT*19);
      ctx.strokeStyle = 'rgba(255,110,80,' + (0.5 + 0.5*beat) + ')'; ctx.lineWidth = 2.4;
    } else {
      ctx.strokeStyle = c && c.toll ? 'rgba(120,160,190,0.8)' : 'rgba(0,0,0,0.5)';
      ctx.lineWidth = c && c.toll ? 1.8 : 1;
    }
    ctx.stroke();
    ctx.textAlign = 'left';
    if(c){
      ctx.fillStyle = '#3a2c18'; ctx.font = 'bold 12px Georgia, serif';
      let head = c.phase === 'callback' ? 'CALL BACK'
               : !c.heardIt ? 'number?'
               : c.child ? 'a child — no number'
               : c.lonely ? 'no number' : wantLabel(c);
      /* on a party wire the caller names the line out loud, so write it on the note */
      if(c.heardIt && !c.toll && !c.inquiry && c.want != null && lines[c.want].party)
        head = lines[c.want].num + '  ' + head;
      let hf = 12;
      ctx.font = 'bold ' + hf + 'px Georgia, serif';
      while(ctx.measureText(head).width > 124 && hf > 8){ hf -= 0.5; ctx.font = 'bold ' + hf + 'px Georgia, serif'; }
      ctx.fillText(head, p.x-62, TICKY+15);

      let st = '', warn = c.busyKnown || c.wrong || c.badCode;
      if(c.child && c.heardIt && !c.resolved) st = childErrand[0];
      else if(c.lonely && c.heardIt && !c.resolved) st = 'she only wants to talk';
      else if(c.promiseAsk && c.heardIt) st = 'she asks a favour';
      else if(c.policeAsk && c.heardIt) st = 'the Sheriff asks';
      else if(c.eavesAsk && c.heardIt) st = 'he asks a thing you should not';
      else if(c.eavesTarget && c.phase === 'live') st = 'not yours to hear';
      else if(c.phase === 'callback') st = 'ring them back';
      else if(c.phase === 'answered') st = c.busyKnown ? 'BUSY — report it'
        : !c.heardIt ? 'line open'
        : c.resolved ? 'ready to take down'
        : c.toll ? (c.ringAcc > 0 ? 'raising ' + c.town + '…' : 'wants a trunk')
        : c.badCode ? 'no one picked up'
        : c.ringAcc > 0 ? 'ringing' : 'waiting';
      else if(c.phase === 'live') st = c.wrong ? 'wrong party'
        : c.toll ? 'toll — talking'
        : c.talked > 55 ? 'still talking…' : 'talking';
      else if(c.phase === 'hungup') st = 'both hung up';
      ctx.fillStyle = warn ? '#8c2f1e' : '#6a5a3c';
      ctx.font = 'italic 10px Georgia, serif';
      ctx.fillText(st, p.x-62, TICKY+27);

      let logTop = TICKY+42;
      /* the ring code for a party line, and whatever you have tapped so far */
      if(c.heardIt && !c.toll && !c.inquiry && c.want != null && lines[c.want].party && !c.resolved){
        const code = lines[c.want].members[c.wantMember].code;
        ctx.font = '9px Georgia, serif'; ctx.fillStyle = '#6a5a3c';
        ctx.fillText('ring', p.x-62, TICKY+40);
        drawCode(p.x-42, TICKY+35, code, '#3a2c18');
        if(p.pattern.length){
          ctx.fillStyle = '#8a7a5c'; ctx.fillText('you', p.x-62, TICKY+52);
          drawCode(p.x-42, TICKY+47, p.pattern, '#8c6a2f');
        }
        logTop = TICKY+62;
      }
      if(c.toll && c.phase === 'answered' && !c.resolved && c.ringAcc > 0){
        ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.fillRect(p.x-62, TICKY+36, 124, 5);
        ctx.fillStyle = '#3f6a8c'; ctx.fillRect(p.x-62, TICKY+36, 124*Math.min(1,c.ringAcc/3.2), 5);
        logTop = TICKY+52;
      }

      ctx.font = '10px Georgia, serif';
      let yy = logTop;
      for(const ln of c.log.slice(-3)){
        ctx.fillStyle = ln.who === 'op' ? '#7a6a4c' : '#3a2c18';
        for(const w of wrap((ln.who === 'op' ? '– ' : '» ') + ln.text, 126).slice(0,2)){
          if(yy > TICKY+TICKH-5) break;
          ctx.fillText(w, p.x-62, yy); yy += 11;
        }
      }
    } else {
      ctx.fillStyle = 'rgba(180,160,120,0.25)'; ctx.font = '10px Georgia, serif';
      ctx.fillText('free', p.x-62, TICKY+15);
    }
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(190,165,110,0.4)'; ctx.font = 'bold 11px Georgia, serif';
    ctx.fillText('PAIR ' + (p.id+1), p.x, TICKY+TICKH+15);
  }

  for(const p of pairs) for(const e of ['front','back']){
    if(endLine(p,e) == null && !dragging(p,e) && !retractOf(p,e)) continue;
    drawCord(springPos(p,e), plugPos(p,e),
             e === 'front' ? '#4b2c20' : '#22343c',
             dragging(p,e) ? 'rgba(255,210,150,0.35)' : null);
  }
  for(const x of crossings()){
    ctx.beginPath(); ctx.arc(x.x, x.y, 4.5, 0, 7);
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fill();
    ctx.beginPath(); ctx.arc(x.x-1, x.y-1, 1.6, 0, 7);
    ctx.fillStyle = 'rgba(255,200,140,0.16)'; ctx.fill();
  }
  for(const p of pairs) for(const e of ['front','back']){
    const pp = plugPos(p,e);
    drawPlug(pp.x, pp.y, endLine(p,e) == null && !dragging(p,e) && !retractOf(p,e));
  }

  if(drag && drag.active && drag.hoverJack){
    const j = drag.hoverJack;
    if(drag.test){
      ctx.textAlign = 'center'; ctx.font = 'bold 12px Georgia, serif';
      ctx.fillStyle = drag.test === 'busy' ? '#ff6a4a' : '#7fd08a';
      ctx.fillText(drag.test === 'busy' ? 'BUSY' : 'FREE', j.x, j.y-42);
    } else {
      ctx.beginPath(); ctx.arc(j.x, j.y, 15 + (1-Math.min(1,drag.hoverT/0.35))*7, 0, 7);
      ctx.strokeStyle = 'rgba(255,220,150,0.28)'; ctx.lineWidth = 1.4; ctx.stroke();
    }
  }
  ctx.textAlign = 'center';
  for(const f of floats){
    ctx.globalAlpha = (f.t < 0.4 ? f.t/0.4 : Math.max(0, 1-(f.t-0.4)/3.8)) * 0.9;
    ctx.font = 'italic 13px Georgia, serif'; ctx.fillStyle = '#d7c08c';
    ctx.fillText(f.text, Math.max(190, Math.min(W-190, f.x)), f.y - f.t*16);
    ctx.globalAlpha = 1;
  }

  renderTutHi();
  renderStatus();
  renderCoach();
  if(mode === 'report') renderReport();
  if(paused) renderPauseMenu();
  if(help) renderHelp();
  renderVolume();
  renderRotate();
}
/* a switchboard is wider than it is tall; a phone held upright is not */
function renderRotate(){
  if(!touchMode || window.innerWidth >= window.innerHeight) return;
  ctx.fillStyle = 'rgba(6,5,4,0.96)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  ctx.strokeStyle = '#8a7546'; ctx.lineWidth = 3;
  rr(W/2-70, H/2-150, 140, 92, 8); ctx.stroke();
  ctx.fillStyle = '#e8cf92'; ctx.font = 'bold 34px Georgia, serif';
  ctx.fillText('Turn the board sideways', W/2, H/2 + 10);
  ctx.fillStyle = '#bda878'; ctx.font = '17px Georgia, serif';
  ctx.fillText('A switchboard is wider than it is tall. So is this one.', W/2, H/2 + 48);
}
function clockStr(){
  const total = SHIFT_START + Math.floor((Math.min(shiftT,SHIFT_LEN)/SHIFT_LEN)*SHIFT_HOURS*60);
  const h24 = ((total/60)|0) % 24;
  const h = (h24 % 12) || 12;
  return h + ':' + String(total%60).padStart(2,'0') + ' ' + (h24 < 12 ? 'AM' : 'PM');
}
function renderStatus(){
  ctx.fillStyle = '#080605'; ctx.fillRect(0,0,W,36);
  ctx.strokeStyle = '#332818'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,36.5); ctx.lineTo(W,36.5); ctx.stroke();

  const waiting = calls.filter(c => c.phase === 'lamp').length;
  const avg = stats.answered ? stats.answerSum/stats.answered : 0;
  const freeT = trunks.filter(t => !lineBusy(t)).length;
  ctx.textAlign = 'left'; ctx.font = '13px Georgia, serif';
  ctx.fillStyle = '#8a7546'; ctx.fillText(D.name, 22, 24);
  ctx.fillText(clockStr(), 140, 24);
  ctx.fillStyle = waiting > 3 ? '#ff8a4d' : '#c9a95f';
  ctx.fillText('LAMPS  ' + waiting, 220, 24);
  ctx.fillStyle = (avg > 0 && avg < 6) ? '#9ed3a4' : '#c9a95f';
  ctx.fillText('ANSWER  ' + (stats.answered ? avg.toFixed(1)+'s' : '—'), 310, 24);
  ctx.fillStyle = freeT ? '#8fc39a' : '#ff6a4a';
  ctx.fillText('TRUNKS  ' + freeT + '/3', 470, 24);
  ctx.fillStyle = callbacks.length ? '#e0b96a' : '#6a5a3c';
  ctx.fillText('SLIPS  ' + callbacks.length, 584, 24);
  ctx.fillStyle = '#c9a95f'; ctx.fillText('DONE  ' + stats.completed, 674, 24);
  const room = ALLOW - stats.abandoned;
  ctx.fillStyle = room <= 1 ? '#ff6a4a' : (room <= 2 ? '#e08a5a' : (stats.abandoned ? '#c9a95f' : '#6a5a3c'));
  ctx.fillText('LOST  ' + stats.abandoned + '/' + ALLOW, 770, 24);
  ctx.fillStyle = stats.errors ? '#ff6a4a' : '#6a5a3c';
  ctx.fillText('MARKS  ' + stats.errors, 864, 24);
  ctx.fillStyle = '#8a7546';
  ctx.fillText('DAY ' + day + (day > 1 ? '   +' + thicker(day) + '%' : ''), 958, 24);
  drawMiniBtn(BTN.help, '?', 13);

  ctx.textAlign = 'center'; ctx.font = '13px Georgia, serif';
  let y = 58;
  for(const m of msgs){
    ctx.globalAlpha = Math.max(0, 1-m.t/5);
    ctx.fillStyle = m.bad ? '#ff7a5a' : '#a8c8a0';
    ctx.fillText(m.text, W/2, y); y += 17;
    ctx.globalAlpha = 1;
  }
  if(tut) return;    /* the walk-through banner sits where the hint line goes */
  ctx.textAlign = 'left'; ctx.font = '11px Georgia, serif'; ctx.fillStyle = 'rgba(150,130,95,0.35)';
  ctx.fillText('drag plugs · hold a plug over a jack to flick-test · 1–8 listening key · Q–I ringing key (hold, or tap a party code) · H help · M mute · [ ] volume', 22, H-13);
}
function renderHelp(){

  ctx.fillStyle = '#e0c98a'; ctx.font = 'bold 24px Georgia, serif';
  ctx.fillText('The position', 96, 62);
  ctx.font = '14px Georgia, serif'; ctx.fillStyle = '#bda878';

    'A lamp lights when a subscriber lifts their receiver. It will not wait long.',
    '',
    '1.   Drag the FRONT plug (left of a pair, red cord) into the lit jack.',

    'PARTY LINES',
    'Some wires carry two or three households. One jack, one number, several',

  for(const t of col1){ ctx.fillText(t, 96, y); y += 21; }

  for(const t of col2){

    ctx.font = (t === 'PARTY LINES' || t === 'TOLL TRUNKS') ? 'bold 13px Georgia, serif' : '14px Georgia, serif';
    ctx.fillText(t, 664, y); y += 21;
  }
  ctx.fillStyle = 'rgba(160,200,170,0.8)'; ctx.font = 'bold 12px Georgia, serif';
  ctx.fillText('ON A TOUCH SCREEN', 96, H-58);
  ctx.fillStyle = 'rgba(190,170,130,0.8)'; ctx.font = '13px Georgia, serif';
  ctx.fillText('Drag the plugs — the plug rides above your fingertip so you can see the jack. Rest it on a jack '
             + 'for a moment to flick-test. Tap LSN and RNG. One finger can hold a', 96, H-40);
  ctx.fillText('ringing key (or tap out a party code) while another works a cord. The ? and speaker at the '
             + 'top right stand in for the keyboard. Hold the device sideways.', 96, H-23);
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(190,170,130,0.5)'; ctx.font = 'italic 13px Georgia, serif';
  ctx.fillText('H, or a tap, closes this.', W-96, H-23);
  ctx.textAlign = 'left';
}
function renderTitle(){
  const g = ctx.createRadialGradient(W/2,320,20,W/2,320,540);
  g.addColorStop(0,'rgba(255,180,90,0.10)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e8cf92'; ctx.font = 'bold 62px Georgia, serif';
  ctx.fillText('HOLD, PLEASE', W/2, 300);
  ctx.fillStyle = '#8a7546'; ctx.font = '18px Georgia, serif';
  ctx.fillText('Verity Exchange · Position 4 · ' + weekdayOf(day) + ', four in the afternoon', W/2, 344);
  ctx.fillStyle = '#bda878'; ctx.font = '15px Georgia, serif';
  ctx.fillText('Eight cord pairs, twenty-four lines, three trunks out of town. One of you.', W/2, 396);

  ctx.fillStyle = 'rgba(190,165,110,0.4)'; ctx.font = 'bold 10px Georgia, serif';
  ctx.fillText('WHAT ARE YOU SIGNED ON AS?   (1, 2, 3)', W/2, 432);
  for(let i=0;i<DIFFS.length;i++){
    const d = DIFFS[i], on = i === diff, y = DIFFY[i];
    if(on){
      rr(W/2-372, y-19, 744, 40, 4);

    }
    ctx.textAlign = 'right';
    ctx.fillStyle = on ? '#e8cf92' : 'rgba(170,150,110,0.5)';

    ctx.fillText(d.name, W/2-150, y-2);
    ctx.textAlign = 'left';
    ctx.fillStyle = on ? 'rgba(200,180,135,0.9)' : 'rgba(150,130,95,0.4)';
    ctx.font = '12px Georgia, serif';
    const rows = wrap(d.blurb, 500);
    ctx.fillText(rows[0], W/2-136, y-7);
    if(rows[1]) ctx.fillText(rows[1], W/2-136, y+8);

  }

  ctx.fillStyle = 'rgba(200,180,135,0.9)'; ctx.font = '14px Georgia, serif';
  ctx.fillText(day === 1
    ? 'Day one. This is the pace the board keeps before it has learned your name.'
    : 'Day ' + day + ' — the traffic runs ' + thicker(day) + '% thicker than your first night.',
    W/2, 590);
  ctx.fillStyle = 'rgba(224,138,90,0.85)'; ctx.font = '13px Georgia, serif';
  ctx.fillText('Lose ' + ALLOW + ' calls in a night — whatever you are signed on as — and the run ends. '
             + 'You start again at day one.', W/2, 610);

  ctx.textAlign = 'center';
  ctx.fillStyle = tutorialOn ? 'rgba(160,200,170,0.75)' : 'rgba(150,130,95,0.5)';
  ctx.font = '13px Georgia, serif';
  ctx.fillText('walk-through for your first call: ' + (tutorialOn ? 'ON' : 'OFF'), W/2, 638);
  ctx.strokeStyle = 'rgba(190,165,110,0.2)'; ctx.lineWidth = 1;
  rr(TBTN.tut.x, TBTN.tut.y, TBTN.tut.w, TBTN.tut.h, 3); ctx.stroke();

  ctx.fillStyle = 'rgba(190,170,130,0.7)'; ctx.font = 'italic 13px Georgia, serif';
  ctx.fillText('the record sheet', W/2 - 180, 666);
  ctx.strokeStyle = 'rgba(190,165,110,0.18)';
  rr(TBTN.scores.x, TBTN.scores.y, TBTN.scores.w, TBTN.scores.h, 3); ctx.stroke();
  if(day > 1){
    ctx.fillStyle = 'rgba(150,130,95,0.55)';
    ctx.fillText('go back to day one', W/2 + 180, 666);
    ctx.strokeStyle = 'rgba(190,165,110,0.14)';
    rr(TBTN.reset.x, TBTN.reset.y, TBTN.reset.w, TBTN.reset.h, 3); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(190,170,130,0.55)'; ctx.font = 'italic 13px Georgia, serif';
  ctx.fillText('Press H for the operating instructions.', W/2, 694);
  ctx.fillStyle = 'rgba(255,200,120,' + (0.45 + 0.35*Math.sin(performance.now()/450)) + ')';
  ctx.font = 'bold 17px Georgia, serif';
  ctx.fillText('—  TAKE THE POSITION  —', W/2, 730);
}
function menuBtn(r, label, sub, warm){
  rr(r.x, r.y, r.w, r.h, 4);
  ctx.fillStyle = warm ? 'rgba(200,90,60,0.10)' : 'rgba(255,255,255,0.045)'; ctx.fill();
  ctx.strokeStyle = warm ? 'rgba(224,138,90,0.45)' : 'rgba(190,165,110,0.32)';
  ctx.lineWidth = 1.2; ctx.stroke();
  ctx.textAlign = 'center';
  ctx.font = 'bold 15px Georgia, serif';
  ctx.fillStyle = warm ? '#e0a084' : '#e0c98a';
  ctx.fillText(label, r.x + r.w/2, r.y + (sub ? 21 : 28));
  if(sub){
    ctx.font = 'italic 11px Georgia, serif'; ctx.fillStyle = 'rgba(180,160,120,0.55)';
    ctx.fillText(sub, r.x + r.w/2, r.y + 36);

}
function renderPauseMenu(){
  ctx.fillStyle = 'rgba(6,5,4,0.88)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e8cf92'; ctx.font = 'bold 34px Georgia, serif';
  ctx.fillText('THE BOARD IS WAITING', W/2, 236);
  ctx.fillStyle = '#8a7546'; ctx.font = '15px Georgia, serif';
  ctx.fillText('Day ' + day + ' · ' + clockStr() + ' · ' + stats.completed + ' put through, '
             + stats.abandoned + ' of ' + ALLOW + ' lost', W/2, 272);
  menuBtn(MENU.resume, 'BACK TO THE POSITION', 'escape');
  menuBtn(MENU.help,   'OPERATING INSTRUCTIONS', 'H');
  menuBtn(MENU.quit,   'GIVE UP THE SHIFT', 'Q  ·  the run ends here, back to day one', true);

const nameBox = document.getElementById('nameentry');
nameBox.addEventListener('keydown', e => {
  e.stopPropagation();
  if(e.key === 'Enter'){ commitName(nameBox.value); hideNameBox(); mode = 'scores'; sfx.good(); }
});
function showNameBox(){
  nameBox.value = '';
  nameBox.style.display = 'block';
  try{ nameBox.focus(); }catch(e){}
}
function hideNameBox(){
  nameBox.style.display = 'none';
  try{ nameBox.blur(); }catch(e){}
}

function renderNamePrompt(){
  if(nameBox.style.display !== 'block') showNameBox();
  ctx.fillStyle = '#0d0a07'; ctx.fillRect(0,0,W,H);
  const g = ctx.createRadialGradient(W/2,330,20,W/2,330,520);
  g.addColorStop(0,'rgba(255,180,90,0.10)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e8cf92'; ctx.font = 'bold 34px Georgia, serif';
  ctx.fillText('YOU ARE ON THE SHEET', W/2, 210);
  ctx.fillStyle = '#bda878'; ctx.font = '17px Georgia, serif';
  ctx.fillText('Day ' + pending.day + ' · ' + pending.done + ' calls put through · '
             + pending.acc + '% of everything offered · as ' + DIFFS[pending.d].name.toLowerCase(),
               W/2, 250);
  ctx.fillStyle = 'rgba(255,200,120,0.9)'; ctx.font = 'bold 20px Georgia, serif';
  ctx.fillText(ordinal(pending.rank) + ' place', W/2, 292);
  ctx.fillStyle = 'rgba(190,170,130,0.65)'; ctx.font = 'italic 14px Georgia, serif';
  ctx.fillText('Miss Pryor keeps a sheet of the girls who lasted. Put your name to it.', W/2, 332);

  rr(SBACK.x, SBACK.y, SBACK.w, SBACK.h, 4);
  ctx.fillStyle = 'rgba(255,200,120,0.09)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,200,120,0.5)'; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.font = 'bold 14px Georgia, serif'; ctx.fillStyle = '#e8cf92';
  ctx.fillText('SIGN IT', W/2, SBACK.y + 21);
  ctx.fillStyle = 'rgba(150,130,95,0.5)'; ctx.font = 'italic 12px Georgia, serif';
  ctx.fillText('or press return', W/2, SBACK.y + 46);
}
function ordinal(n){
  const s = ['th','st','nd','rd'], v = n % 100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}
function renderScores(){
  ctx.fillStyle = '#0d0a07'; ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e8cf92'; ctx.font = 'bold 30px Georgia, serif';
  ctx.fillText('THE RECORD SHEET', W/2, 70);
  ctx.font = '13px Georgia, serif'; ctx.fillStyle = '#8a7546';
  ctx.fillText('Verity Exchange · Position 4 · every night worked', W/2, 94);

  const labels = ['ALL', ...DIFFS.map(d => d.name)];
  for(let i=0;i<SFILT.length;i++){
    const r = SFILT[i], on = scoreFilter === i-1;
    rr(r.x, r.y, r.w, r.h, 3);
    ctx.fillStyle = on ? 'rgba(255,200,120,0.10)' : 'rgba(255,255,255,0.025)'; ctx.fill();
    ctx.strokeStyle = on ? 'rgba(255,200,120,0.5)' : 'rgba(190,165,110,0.2)';
    ctx.lineWidth = on ? 1.6 : 1; ctx.stroke();
    ctx.font = 'bold 12px Georgia, serif';
    ctx.fillStyle = on ? '#e8cf92' : 'rgba(170,150,110,0.55)';
    ctx.fillText(labels[i], r.x + r.w/2, r.y + 20);
  }

  const rows = scoreRows();
  if(!rows.length){
    ctx.font = 'italic 16px Georgia, serif'; ctx.fillStyle = 'rgba(180,160,120,0.5)';
    ctx.fillText('Nothing on the sheet yet. Work a night and come back.', W/2, 300);
  } else {
    /* the three figures that matter */
    const best = [
      ['DAYS REACHED',       Math.max(...rows.map(r => r.day))],
      ['CALLS IN A NIGHT',   Math.max(...rows.map(r => r.done))],
      ['BEST ACCURACY',      Math.max(...rows.map(r => r.acc)) + '%']
    ];
    for(let i=0;i<3;i++){
      const cx = W/2 - 300 + i*300;
      ctx.font = 'bold 11px Georgia, serif'; ctx.fillStyle = '#8a7546';
      ctx.fillText(best[i][0], cx, 194);
      ctx.font = 'bold 40px Georgia, serif'; ctx.fillStyle = '#e8cf92';
      ctx.fillText(String(best[i][1]), cx, 236);
    }
    const tot = rows.reduce((a,r) => ({ done:a.done+r.done, lost:a.lost+r.lost }), {done:0,lost:0});
    ctx.font = '13px Georgia, serif'; ctx.fillStyle = 'rgba(190,170,130,0.7)';
    ctx.fillText(rows.length + ' nights worked · ' + tot.done + ' calls put through · '
               + (tot.done+tot.lost ? Math.round(tot.done/(tot.done+tot.lost)*100) : 0)
               + '% of everything offered', W/2, 266);

  }

  /* the sheet proper: named runs, best first */
  const lead = leaderRows();
  ctx.textAlign = 'center';
  ctx.font = 'bold 11px Georgia, serif'; ctx.fillStyle = '#8a7546';
  ctx.fillText('THE GIRLS WHO LASTED', W/2, 300);
  if(!lead.length){
    ctx.font = 'italic 15px Georgia, serif'; ctx.fillStyle = 'rgba(180,160,120,0.45)';
    ctx.fillText('No names yet. A run goes on the sheet when the chief pulls you off the board.', W/2, 340);
  } else {
    const COL = [W/2-350, W/2-300, W/2-90, W/2+75, W/2+185, W/2+300];
    const head = ['','NAME','SIGNED ON','DAY','CALLS','ACCURACY'];
    ctx.font = 'bold 11px Georgia, serif'; ctx.fillStyle = '#8a7546';
    for(let i=0;i<head.length;i++){ ctx.textAlign = i<3 ? 'left' : 'right'; ctx.fillText(head[i], COL[i], 322); }
    ctx.strokeStyle = 'rgba(120,100,70,0.3)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(W/2-356, 330); ctx.lineTo(W/2+306, 330); ctx.stroke();
    let y = 352;
    lead.slice(0, LEADER_SLOTS).forEach((r, i) => {
      const mine = pending && r.cid === pending.cid && r.name;
      if(mine){
        rr(W/2-356, y-15, 662, 22, 3);
        ctx.fillStyle = 'rgba(255,200,120,0.10)'; ctx.fill();
      }
      const cells = [ordinal(i+1), r.name, DIFFS[r.d] ? DIFFS[r.d].name.toLowerCase() : '—',
                     String(r.day), String(r.done), r.acc + '%'];
      ctx.font = (mine ? 'bold ' : '') + '14px Georgia, serif';
      for(let j=0;j<cells.length;j++){
        ctx.textAlign = j<3 ? 'left' : 'right';
        ctx.fillStyle = mine ? '#e8cf92' : (j === 0 ? '#8a7546' : 'rgba(200,180,135,0.8)');
        ctx.fillText(cells[j], COL[j], y);
      }
      y += 24;
    });
    /* and where this run stood, whether or not it made the sheet */
    if(pending){
      y += 12;
      ctx.textAlign = 'center'; ctx.font = 'italic 14px Georgia, serif';
      ctx.fillStyle = pending.qualifies ? 'rgba(160,205,175,0.9)' : 'rgba(224,138,90,0.9)';
      ctx.fillText(pending.qualifies
        ? 'Your run stands ' + ordinal(pending.rank) + '.'
        : 'Your run placed ' + ordinal(pending.rank) + ' — not far enough for the sheet. '
          + 'Day ' + pending.day + ', ' + pending.done + ' calls, ' + pending.acc + '%.',
        W/2, y);
    }
  }

  ctx.textAlign = 'center';
  rr(SBACK.x, SBACK.y, SBACK.w, SBACK.h, 4);
  ctx.fillStyle = 'rgba(255,255,255,0.04)'; ctx.fill();
  ctx.strokeStyle = 'rgba(190,165,110,0.3)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.font = 'bold 14px Georgia, serif'; ctx.fillStyle = 'rgba(210,190,145,0.85)';
  ctx.fillText(pending ? 'BEGIN AGAIN AT DAY ONE' : 'BACK', W/2, SBACK.y + 21);
}
function renderReport(){
  ctx.fillStyle = 'rgba(6,5,4,0.94)'; ctx.fillRect(0,0,W,H);
  const avg = stats.answered ? stats.answerSum/stats.answered : 99;
  ctx.textAlign = 'center';
  const dshown = (stats.failed && pending) ? pending.day : day;
  ctx.fillStyle = stats.failed ? '#e07a5a' : '#e8cf92'; ctx.font = 'bold 32px Georgia, serif';
  ctx.fillText('DAY ' + dshown + (stats.failed
    ? (stats.walked ? ' · YOU WALKED OFF' : ' · TAKEN OFF THE POSITION')
    : ' · SHIFT REPORT'), W/2, 76);
  ctx.font = '14px Georgia, serif'; ctx.fillStyle = '#8a7546';
  ctx.fillText('Verity Exchange · ' + weekdayOf(dshown) + ' · ' + D.name.toLowerCase()
             + ' · initialled A.P.', W/2, 100);

  const rows = [
    ['Calls answered', stats.answered],
    ['Average answering time', stats.answered ? avg.toFixed(1)+' seconds' : '—'],
    ['Fastest', stats.best < 999 ? stats.best.toFixed(1)+' seconds' : '—'],
    ['Completed', stats.completed],
    ['Toll calls put through', stats.toll],
    ['Call-backs kept / broken', stats.kept + ' / ' + stats.broken],
    ['Lost or abandoned', stats.abandoned],
    ['Marks against', stats.errors]
  ];
  ctx.font = '15px Georgia, serif';
  let y = 146;
  for(const [k,v] of rows){
    ctx.textAlign = 'right'; ctx.fillStyle = '#a89468'; ctx.fillText(k, W/2-20, y);
    ctx.textAlign = 'left';  ctx.fillStyle = '#e8cf92'; ctx.fillText(String(v), W/2+20, y);
    y += 27;
  }
  const score = avg + stats.errors*0.8 + stats.abandoned*0.5 + stats.broken*1.5;
  let note = CHIEF[CHIEF.length-1][1];
  for(const [th,n] of CHIEF) if(score <= th){ note = n; break; }
  if(stats.failed) note = stats.walked
    ? '“You took the headset off in the middle of a shift. Ruth has your cords now. '
    + 'Whatever you had built here, you have given it back.”'
    : '“That is enough. Ruth will finish the night — she has been standing behind you for ten minutes. '
    + 'Go home. Whatever you had built here, it is gone.”';
  ctx.textAlign = 'center'; ctx.font = 'italic 15px Georgia, serif'; ctx.fillStyle = '#d7c08c';
  y += 14;
  for(const w of wrap(note, 780)){ ctx.fillText(w, W/2, y); y += 23; }
  /* nudge them off the help once they can hold the board down without it */
  if(!stats.failed && diff < DIFFS.length-1 && stats.completed >= 12 && stats.abandoned <= 3 && avg < 8){
    y += 6;
    ctx.font = '14px Georgia, serif'; ctx.fillStyle = 'rgba(160,205,175,0.85)';
    ctx.fillText('You could work this board as ' + DIFFS[diff+1].name.toLowerCase()
               + '. Sign on for it before the next day.', W/2, y);
    y += 20;
  }

  if(heard.length){
    y += 26;
    ctx.font = 'bold 13px Georgia, serif'; ctx.fillStyle = '#8a7546';
    ctx.fillText('WHAT YOU HEARD TONIGHT, AND WILL NOT REPEAT', W/2, y); y += 23;
    ctx.font = 'italic 14px Georgia, serif'; ctx.fillStyle = 'rgba(215,192,140,0.75)';
    for(const f of heard.slice(0,6)){ ctx.fillText(f, W/2, y); y += 20; }
  }
  ctx.font = '13px Georgia, serif'; ctx.fillStyle = 'rgba(190,170,130,0.7)';
  if(stats.failed){
    ctx.fillText(stats.walked
      ? 'You walked off in the middle of day ' + dshown + '. The run ends there — you start again at day one.'
      : 'You lost ' + stats.abandoned + ' calls; the exchange allows ' + ALLOW
        + '. ' + dshown + (dshown === 1 ? ' night, gone.' : ' nights, gone — you start again at day one.'),
      W/2, H-66);
  } else {
    /* tomorrow is 5% busier than today, and it says so before you agree to it */
    ctx.fillText('Day ' + (day+1) + ' — ' + weekdayOf(day+1) + ' — runs '
               + Math.round((DAY_STEP-1)*100) + '% thicker again, '
               + thicker(day+1) + '% above your first night.', W/2, H-66);
  }
  ctx.font = '15px Georgia, serif';
  ctx.fillStyle = stats.failed
    ? 'rgba(230,140,110,' + (0.5 + 0.3*Math.sin(performance.now()/450)) + ')'
    : 'rgba(255,200,120,' + (0.4 + 0.3*Math.sin(performance.now()/450)) + ')';
  ctx.fillText(stats.failed ? '—  BEGIN AGAIN AT DAY ONE  —'
                            : '—  GO ON TO DAY ' + (day+1) + '  —', W/2, H-38);
}

/* ---------------------------------------------------------------- loop */
reset(); mode = 'title';
let last = performance.now();
function frame(t){
  const dt = Math.min(0.05, (t-last)/1000); last = t;
  update(dt); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
